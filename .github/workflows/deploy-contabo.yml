name: Deploy Contabo (rental.system.sellmate.lk)

# SellMate-ElectronicShops SPA → https://rental.system.sellmate.lk

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: contabo-electronicshops-rental-system
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Contabo rental.system SPA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        env:
          VITE_BASE_URL: https://api.sellmate.lk/api
          VITE_CLOUDINARY_URL: https://res.cloudinary.com
          VITE_SHOP_SITE_URL: https://online.shop.sellmate.lk
          VITE_PUBLIC_SITE_URL: https://rental.sellmate.lk
          VITE_SOCKET_URL: https://api.sellmate.lk
          VITE_SUPER_ADMIN_SECRET: ${{ secrets.VITE_SUPER_ADMIN_SECRET }}
          VITE_META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
        run: |
          npm ci
          npm run build
          tar -cf electronicshops-dist.tar -C dist .

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          source: "electronicshops-dist.tar"
          target: /tmp/
          overwrite: true

      - name: Publish on Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP=/var/www/sellmate-electronicshops
            mkdir -p "$APP"
            rm -rf "$APP"/*
            tar -xf /tmp/electronicshops-dist.tar -C "$APP"
            chown -R www-data:www-data "$APP"
            grep -o '<title>[^<]*</title>' "$APP/index.html"
            curl -fsS -o /dev/null -w 'rental_system=%{http_code}\n' -H 'Host: rental.system.sellmate.lk' http://127.0.0.1/
            curl -fsS http://127.0.0.1:3000/health >/dev/null && echo SELLMATE_API_OK
